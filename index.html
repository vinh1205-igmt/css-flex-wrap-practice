<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-wrap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>1. flex-wrap: wrap (Xuống dòng tự động)</h2>
    <div class="container ex-wrap">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>2. flex-wrap: nowrap (Không xuống dòng - Mặc định)</h2>
    <div class="container ex-nowrap">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>3. flex-wrap: wrap-reverse (Xuống dòng và đảo ngược trục phụ)</h2>
    <div class="container ex-wrap-reverse">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>4. flex-wrap: initial (Khôi phục giá trị mặc định: nowrap)</h2>
    <div class="container ex-initial">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
